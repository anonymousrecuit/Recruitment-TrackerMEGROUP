<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interview Scorecard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>body{font-family:Inter,system-ui,sans-serif}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px}.muted{color:#64748b}</style>
</head>
<body class="bg-slate-50 text-slate-800">
<div class="max-w-4xl mx-auto p-4 md:p-8">
  <div class="flex items-center gap-3 mb-5"><div class="w-11 h-11 rounded-xl bg-indigo-600 text-white font-bold flex items-center justify-center">RT</div><div><h1 class="text-xl font-bold">Interview Scorecard</h1><p class="text-sm muted">Form penilaian interviewer</p></div></div>
  <div id="loading" class="card p-8 text-center"><i class="fas fa-spinner fa-spin text-indigo-600 mr-2"></i>Memuat scorecard...</div>
  <div id="error" class="hidden card p-6 border-red-200 bg-red-50 text-red-700"></div>
  <main id="app" class="hidden space-y-4"></main>
</div>
<script>
const SUPABASE_URL='https://nhzlsxvrlqswdxsnkwhv.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_5CArCM5F9Oxl_i1aWZzd_Q_G-yFAzv-';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let DATA=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=new URLSearchParams(location.search).get('token');
const RED_FLAGS=['Jawaban tidak konsisten dengan CV/profil','Tidak dapat menjelaskan tanggung jawab/pencapaian sebelumnya','Pola perpindahan kerja perlu klarifikasi','Alasan keluar perlu pendalaman','Mandatory requirement belum terbukti','Kesenjangan kompetensi teknis signifikan','Leadership concern','Komunikasi/kolaborasi concern','Kesiapan shift/lokasi tidak sesuai','Kesiapan join/notice period bermasalah','Ekspektasi kompensasi berpotensi mismatch','Informasi penting belum terverifikasi'];
const FIRST=['Kerapian & kesesuaian penampilan','Ketepatan waktu','Sikap awal & sopan santun','Postur & komunikasi nonverbal','Kejelasan berbicara','Responsiveness / menangkap pertanyaan'];
function fail(m){document.getElementById('loading').classList.add('hidden');const e=document.getElementById('error');e.classList.remove('hidden');e.textContent=m;}
function bgLines(c){return [c.education&&`Pendidikan: ${c.education}${c.major?' · '+c.major:''}`,c.experience!=null&&`Pengalaman: ${c.experience} tahun`,c.last_role&&`Jabatan terakhir: ${c.last_role}`,c.last_company&&`Perusahaan terakhir: ${c.last_company}`,c.notice_period&&`Notice period: ${c.notice_period}`,c.willing_shift&&`Bersedia shift: ${c.willing_shift}`,c.apply_reason&&`Alasan melamar: ${c.apply_reason}`].filter(Boolean)}
function levelHelp(n){return {1:'Dasar / Perlu Arahan',2:'Operasional / Cukup Mandiri',3:'Mahir / Mandiri',4:'Ahli / Pengembang Sistem'}[n]||'BT / Belum cukup informasi'}
function render(){const d=DATA,c=d.candidate,p=d.position,co=d.company,l=d.link,t=d.templates||[];document.title=`Scorecard · ${c.candidate_name||'Kandidat'}`;document.getElementById('loading').classList.add('hidden');const app=document.getElementById('app');app.classList.remove('hidden');app.innerHTML=`
<div class="card p-5"><div class="flex flex-col md:flex-row md:justify-between gap-3"><div><div class="text-xs uppercase muted">${esc(l.interview_type)}</div><h2 class="text-2xl font-bold mt-1">${esc(c.candidate_name)}</h2><div class="text-sm muted mt-1">${esc(p.position_name)} · ${esc(co.brand||co.company_name)}</div></div><div class="text-sm md:text-right"><div>Interviewer: <b>${esc(l.interviewer_name||'Belum ditentukan')}</b></div><div class="muted">Berlaku sampai ${new Date(l.expires_at).toLocaleString('id-ID')}</div></div></div></div>
<div class="card p-5"><h3 class="font-bold">Latar Belakang CV / Profil</h3><p class="text-xs muted mt-1">Gunakan sebagai konteks. Verifikasi jawaban kandidat terhadap informasi ini selama interview.</p><div class="grid md:grid-cols-2 gap-2 mt-3">${bgLines(c).map(x=>`<div class="bg-slate-50 rounded-lg p-2 text-sm">${esc(x)}</div>`).join('')||'<div class="text-sm muted">Data terstruktur kandidat terbatas.</div>'}</div><textarea id="cvNotes" rows="3" class="w-full border rounded-lg p-3 text-sm mt-3" placeholder="Catatan konsistensi CV/profil dengan jawaban interview"></textarea></div>
${l.interview_type==='Interview HR'?`<div class="card p-5"><h3 class="font-bold">A. First Impression & Observation</h3><p class="text-xs muted mt-1">Nilai 1–4. First Impression dipisahkan dari kompetensi jabatan.</p><div class="space-y-3 mt-3">${FIRST.map((x,i)=>`<div class="grid md:grid-cols-[1fr_170px_1fr] gap-2 items-center impression-row" data-name="${esc(x)}"><div class="text-sm font-medium">${esc(x)}</div><select class="impression-score border rounded-lg p-2 text-sm"><option value="">BT</option><option value="1">1 · Kurang</option><option value="2">2 · Cukup</option><option value="3">3 · Baik</option><option value="4">4 · Sangat Baik</option></select><input class="impression-note border rounded-lg p-2 text-sm" placeholder="Catatan (opsional)"></div>`).join('')}</div></div>`:''}
<div class="card p-5"><h3 class="font-bold">B. Competency-Based Interview</h3><p class="text-xs muted mt-1">Gunakan evidence konkret. BT tidak dihitung sebagai nilai nol.</p><div class="space-y-4 mt-4">${t.map(x=>`<section class="border rounded-xl p-4 score-row" data-template="${esc(x.template_id)}" data-required="${x.required_evidence?'1':'0'}" data-mandatory="${x.is_mandatory?'1':'0'}"><div class="flex justify-between gap-3"><div><div class="font-semibold">${esc(x.competency_name)} ${x.is_mandatory?'<span class="text-[10px] text-red-600">MANDATORY</span>':''}</div><div class="text-xs muted">${esc(x.competency_definition||'')}</div></div><div class="text-xs muted">Bobot ${Math.round(Number(x.weight||1)*100)}%</div></div><div class="bg-indigo-50 rounded-lg p-3 text-sm mt-3"><b>Pertanyaan:</b> ${esc(x.question_text||'Gali bukti pengalaman yang relevan.')}</div><div class="grid md:grid-cols-[180px_1fr] gap-3 mt-3"><div><select class="score border rounded-lg p-2 w-full"><option value="">BT</option><option value="1">1 · Dasar</option><option value="2">2 · Cukup Mandiri</option><option value="3">3 · Mahir</option><option value="4">4 · Ahli</option></select><div class="level text-[11px] muted mt-1"></div></div><textarea class="evidence border rounded-lg p-2 text-sm" rows="3" placeholder="Evidence konkret${x.required_evidence?' — wajib':''}"></textarea></div></section>`).join('')||'<div class="text-amber-700">Belum ada master scorecard aktif untuk posisi ini.</div>'}</div></div>
<div class="card p-5"><h3 class="font-bold">C. Red Flag / Concern</h3><p class="text-xs muted mt-1">Checklist adalah sinyal untuk diklarifikasi, bukan keputusan otomatis menggugurkan kandidat.</p><div class="grid md:grid-cols-2 gap-2 mt-3">${RED_FLAGS.map(x=>`<label class="border rounded-lg p-2 text-sm flex gap-2"><input type="checkbox" class="redflag" value="${esc(x)}"> <span>${esc(x)}</span></label>`).join('')}</div><textarea id="redFlagNotes" class="w-full border rounded-lg p-3 text-sm mt-3" rows="3" placeholder="Klarifikasi red flag / concern"></textarea></div>
<div class="card p-5"><h3 class="font-bold">D. Kesimpulan & Rekomendasi</h3><label class="text-xs muted block mt-3">Nama interviewer</label><input id="who" class="w-full border rounded-lg p-2" value="${esc(l.interviewer_name||'')}" placeholder="Nama lengkap interviewer"><label class="text-xs muted block mt-3">Rekomendasi</label><select id="rec" class="w-full border rounded-lg p-2"><option>Sangat Direkomendasikan</option><option>Direkomendasikan</option><option>Pertimbangkan</option><option>Rekomendasikan Posisi Lain</option><option>Talent Pool</option><option>Tidak Direkomendasikan</option></select><textarea id="notes" class="w-full border rounded-lg p-3 text-sm mt-3" rows="4" placeholder="Kesimpulan interviewer"></textarea><div class="flex justify-end mt-4"><button id="submitBtn" onclick="submitScorecard()" class="px-5 py-3 rounded-lg bg-indigo-600 text-white font-semibold">Submit Hasil Interview</button></div></div>`;
app.querySelectorAll('.score').forEach(s=>s.addEventListener('change',()=>s.parentElement.querySelector('.level').textContent=levelHelp(Number(s.value))));}
async function load(){if(!token)return fail('Token interview tidak ditemukan pada URL.');const {data,error}=await sb.rpc('get_interview_portal_data',{p_token:token});if(error)return fail(error.message);DATA=data;render();}
async function submitScorecard(){const rows=[...document.querySelectorAll('.score-row')];const scores=[];let evidenceMissing=false,mandatoryMissing=false;for(const r of rows){const score=r.querySelector('.score').value,evidence=r.querySelector('.evidence').value.trim();if(!score){if(r.dataset.mandatory==='1'){r.querySelector('.score').classList.add('border-red-500');mandatoryMissing=true;}continue;}r.querySelector('.score').classList.remove('border-red-500');if(r.dataset.required==='1'&&!evidence){r.querySelector('.evidence').classList.add('border-red-500');evidenceMissing=true;}else{r.querySelector('.evidence').classList.remove('border-red-500');}scores.push({template_id:r.dataset.template,score:Number(score),evidence});}if(mandatoryMissing)return alert('Semua kompetensi mandatory wajib dinilai.');if(!scores.length)return alert('Nilai minimal satu kompetensi.');if(evidenceMissing)return alert('Lengkapi evidence yang wajib.');const first=[...document.querySelectorAll('.impression-row')].map(r=>({name:r.dataset.name,score:Number(r.querySelector('.impression-score').value||0),note:r.querySelector('.impression-note').value.trim()})).filter(x=>x.score);const flags=[...document.querySelectorAll('.redflag:checked')].map(x=>x.value);const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='Mengirim...';const {data,error}=await sb.rpc('submit_interview_portal_scorecard',{p_token:token,p_interviewer_name:document.getElementById('who').value.trim(),p_scores:scores,p_first_impression:first,p_red_flags:flags,p_red_flag_notes:document.getElementById('redFlagNotes').value.trim()||null,p_cv_notes:document.getElementById('cvNotes').value.trim()||null,p_recommendation:document.getElementById('rec').value,p_notes:document.getElementById('notes').value.trim()||null});if(error){btn.disabled=false;btn.textContent='Submit Hasil Interview';return alert('Gagal submit: '+error.message);}document.getElementById('app').innerHTML=`<div class="card p-8 text-center"><div class="w-16 h-16 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto text-2xl"><i class="fas fa-check"></i></div><h2 class="text-2xl font-bold mt-4">Hasil interview berhasil dikirim</h2><p class="muted mt-2">Score ${(data?.score_100??'-')}/100. Link ini sekarang terkunci dan hasil sudah masuk ke ATS HR.</p></div>`;}
load();
</script>
</body></html>
